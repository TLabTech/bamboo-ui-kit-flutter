name: flutter_bamboo_ui_kit
description: "A custom widget made from TLab for TLab."
version: 0.0.2
homepage: https://tlab.co.id/
repository: 'https://github.com/TLabTech/bamboo-ui-kit-flutter'

#publish_to: none

environment:
  sdk: ^3.6.1
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  syncfusion_flutter_charts: ^33.2.12
  persistent_bottom_nav_bar_v2: ^6.3.2
  table_calendar: ^3.1.3
  dropdown_button2: ^3.1.0
  flutter_bloc: ^9.1.0
  auto_size_text: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner:
  flutter_gen_runner:

flutter_gen:
  assets:
    outputs:
      package_parameter_enabled: true
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  assets:
    - assets/svg/

  fonts:
     - family: Inter
       fonts:
         - asset: assets/fonts/inter.ttf
